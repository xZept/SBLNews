[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbl-news-pipeline"
version = "0.1.0"
description = "Automated daily primary resistance-training literature ingestion and deterministic evidence scoring pipeline for SBL News."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "supabase>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
