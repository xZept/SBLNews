name: Daily Literature Ingestion

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Number of days to look back for new studies"
        required: false
        default: "3"
      max_papers:
        description: "Maximum number of papers to process per run"
        required: false
        default: "25"

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run daily ingestion pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUBMED_EMAIL: ${{ secrets.PUBMED_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: |
          python -m src.cli ingest \
            --lookback-days "${{ github.event.inputs.lookback_days || '3' }}" \
            --max-papers "${{ github.event.inputs.max_papers || '25' }}"
